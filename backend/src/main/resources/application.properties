# 애플리케이션 이름
spring.application.name=backend

# 서버 포트
server.port=8080

# 파일 업로드 용량 제한(기본값 1MB라 리뷰/프로필 이미지 업로드 시 초과 오류가 났음)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MySQL 연결 정보
# 참고: mariadb-java-client는 MySQL Connector/J의 serverTimezone 옵션을 지원하지 않아 조용히
# 무시된다(그래서 저장 시각이 몇 시간씩 어긋나 보였다). 이 드라이버가 실제로 지원하는
# connectionTimeZone과 forceConnectionTimeZoneToSession으로 접속 시마다 DB 세션의
# time_zone 자체를 강제 설정한다. "Asia/Seoul"처럼 이름으로 주면 DB 서버에 명명된 타임존
# 테이블(mysql.time_zone_name)이 로드돼 있어야 하는데 이 서버엔 없어서 커넥션 자체가
# 실패했다(Unknown or incorrect time zone). 한국은 서머타임이 없어 오프셋이 항상 +09:00로
# 고정이므로, 테이블 없이도 동작하는 고정 오프셋으로 지정한다.
spring.datasource.url=jdbc:mariadb://34.64.201.38:3306/trma?useSsl=false&connectionTimeZone=+09:00&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
spring.datasource.username=tmadmin
spring.datasource.password=xmflq00!
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.backend.trma.dto

# JPA 설정
spring.jpa.hibernate.ddl-auto=validate

# 실행 SQL 출력
spring.jpa.show-sql=true

# SQL 보기 좋게 출력
spring.jpa.properties.hibernate.format_sql=true

# 개발 편의 옵션
spring.jpa.open-in-view=false

# jjwt
jwt.secret=trma-secret-key-2026-this-key-must-be-long-enough-123456789
jwt.expiration=21600000
jwt.rememberMeExpiration=2592000000
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

